name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run budget
      - run: npm run e2e
      # CI runners have no GPU, so the site (correctly) serves the still-frame fallback here.
      # That path's LCP is the hero still (~1.6-1.9s); the 1500ms budget for the real 3D path
      # is lighthouserc.json, checked locally with `npx lhci autorun` on a GPU machine.
      - run: npx lhci autorun --config=lighthouserc.ci.json
      - name: Lighthouse metrics summary
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          for (const f of fs.readdirSync(".lighthouseci").filter((f) => f.startsWith("lhr-") && f.endsWith(".json"))) {
            const d = JSON.parse(fs.readFileSync(".lighthouseci/" + f));
            const a = d.audits, n = (k) => Math.round(a[k].numericValue);
            console.log(d.finalDisplayedUrl, "perf", d.categories.performance.score,
              "FCP", n("first-contentful-paint"), "LCP", n("largest-contentful-paint"),
              "TBT", n("total-blocking-time"), "SI", n("speed-index"),
              "CLS", a["cumulative-layout-shift"].numericValue.toFixed(3),
              "bench", Math.round(d.environment.benchmarkIndex));
          }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          include-hidden-files: true
          path: |
            .lighthouseci
            test-results
  deploy:
    # GitHub Pages, from main only, after every quality gate has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
